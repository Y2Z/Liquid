name: CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'dist/'
      - 'docs/'
      - 'sample-apps/'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Qt 5.15 from distro packages
          - os: ubuntu-22.04
            qt: 5
          # Qt 6 from distro packages
          - os: ubuntu-24.04
            qt: 6
          # Qt 6 from the Qt online repository
          - os: macos-14
            qt: 6
          - os: windows-2022
            qt: 6

    steps:
    - uses: actions/checkout@v4

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - name: Resolve dependencies (Ubuntu, Qt 5)
      run: |
        sudo apt-get update
        sudo apt-get install -y qtbase5-dev qtwebengine5-dev libqt5svg5-dev qt5-qmake libx11-dev
        echo "QMAKE=qmake" >> "$GITHUB_ENV"
      if: runner.os == 'Linux' && matrix.qt == 5

    - name: Resolve dependencies (Ubuntu, Qt 6)
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-webengine-dev qt6-svg-dev qmake6 libgl-dev libx11-dev
        echo "QMAKE=qmake6" >> "$GITHUB_ENV"
      if: runner.os == 'Linux' && matrix.qt == 6

    - name: Resolve dependencies (macOS and Windows)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        modules: 'qtwebengine qtwebchannel qtpositioning'
      if: runner.os != 'Linux'

    - name: Resolve dependencies (macOS icon tools)
      run: brew install imagemagick
      if: runner.os == 'macOS'

    - name: Build (Ubuntu and macOS)
      run: |
        ${QMAKE:-qmake}
        make -j
      if: runner.os != 'Windows'

    - name: Build (Windows)
      run: |
        qmake
        nmake
      if: runner.os == 'Windows'
